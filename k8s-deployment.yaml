# -------------------------------------------------------------------------
# 1. SERVICE
# -------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: ai-robot-service
  namespace: robot-ai-its
  labels:
    app: ai-robot
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app: ai-robot
  type: ClusterIP # Internal only, akses luar via Route

---
# -------------------------------------------------------------------------
# 2. DEPLOYMENT
# -------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-robot-service
  namespace: robot-ai-its
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-robot
  template:
    metadata:
      labels:
        app: ai-robot
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64

      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: robot-container
          image: image-registry.openshift-image-registry.svc:5000/robot-ai-its/ai-robot-service:latest
          imagePullPolicy: IfNotPresent

          env:
            - name: YOLO_OFFLINE
              value: "True"
            - name: PYTHONUNBUFFERED
              value: "1"

          ports:
            - containerPort: 8000
              name: ws-port

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10

          resources:
            limits:
              nvidia.com/gpu: 1
              memory: "16Gi"
              cpu: "4"
            requests:
              nvidia.com/gpu: 1
              memory: "8Gi"
              cpu: "2"

          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: cache-vol
              mountPath: /app/.cache

      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
        - name: cache-vol
          emptyDir: {}

---
# -------------------------------------------------------------------------
# 3. ROUTE
# -------------------------------------------------------------------------
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ai-robot-route
  namespace: robot-ai-its
  annotations:
    # Timeout lebih tinggi untuk WebSocket streaming (5 menit)
    haproxy.router.openshift.io/timeout: 300s
    # Enable WebSocket support
    haproxy.router.openshift.io/balance: source
spec:
  # Route ini akan menghasilkan URL internal seperti:
  # ai-robot-route-robot-ai-its.apps.cluster-name.domain.local
  to:
    kind: Service
    name: ai-robot-service
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Allow
